<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women's New Arrivals - Rakesh Designs</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }
        .product-card {
            border: 1px solid #e2d9cd;
            padding: 15px;
            border-radius: 8px;
            background-color: #ffffff;
            text-align: center;
        }
        .product-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 5px;
        }
        .product-title {
            font-size: 1.1rem;
            margin: 10px 0 5px 0;
            font-weight: bold;
        }
        .price {
            font-weight: bold;
            color: #2b2623;
            margin: 5px 0;
        }
        .btn-add {
            background-color: #2b2623;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Sales & Offers</a></li>
                <li><a href="menclothing.html">Men</a></li>
                <li><a href="womenclothing.html">Women</a></li>
                <li><a href="womennewarrivals.html">New Arrivals</a></li>
                <li><a href="contactus.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main style="padding: 20px;">
        <h1>Women's New Arrivals</h1>
        <p>Check out our latest trending fashion items for women.</p>

        <div class="product-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=600&auto=format&fit=crop" alt="Summer Floral Dress">
                <div class="product-title">Summer Floral Dress</div>
                <div>⭐⭐⭐⭐⭐</div>
                <div class="price">$74.90</div>
                <button class="btn-add">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1548883354-7622d03aca27?w=600&auto=format&fit=crop" alt="Modern Winter Coat">
                <div class="product-title">Modern Winter Coat</div>
                <div>⭐⭐⭐⭐⭐</div>
                <div class="price">$129.90</div>
                <button class="btn-add">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?w=600&auto=format&fit=crop" alt="Trendy Top">
                <div class="product-title">Trendy Stylish Top</div>
                <div>⭐⭐⭐⭐⭐</div>
                <div class="price">$39.90</div>
                <button class="btn-add">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?w=600&auto=format&fit=crop" alt="Designer Shoulder Bag">
                <div class="product-title">Designer Shoulder Bag</div>
                <div>⭐⭐⭐⭐⭐</div>
                <div class="price">$89.90</div>
                <button class="btn-add">Add to Cart</button>
            </div>
        </div>
    </main>

</body>
</html>
