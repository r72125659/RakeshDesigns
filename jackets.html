<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <header class="main-header">
        <div class="header-container">
            <div class="logo"><a href="index.html">Rakesh<span>Designs</span></a></div>
            <nav class="navbar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="tshirts.html">T-Shirts</a></li>
                    <li><a href="jackets.html" class="active">Jackets</a></li>
                    <li><a href="jeans.html">Jeans</a></li>
                    <li><a href="contactus.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container section-padding">
        <h1 class="section-title">Trending Jackets</h1>
        <div class="product-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?w=600" alt="Leather Jacket">
                <div class="product-info">
                    <h3>Classic Leather Jacket</h3>
                    <div class="price">$129.90</div>
                    <button class="btn-add">Add to Cart</button>
                </div>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1544441893-675973e31985?w=600" alt="Denim Jacket">
                <div class="product-info">
                    <h3>Casual Denim Jacket</h3>
                    <div class="price">$89.90</div>
                    <button class="btn-add">Add to Cart</button>
                </div>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=600" alt="Winter Coat">
                <div class="product-info">
                    <h3>Modern Winter Coat</h3>
                    <div class="price">$149.90</div>
                    <button class="btn-add">Add to Cart</button>
                </div>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1548883354-7622d03aca27?w=600" alt="Windbreaker">
                <div class="product-info">
                    <h3>Sporty Windbreaker</h3>
                    <div class="price">$69.90</div>
                    <button class="btn-add">Add to Cart</button>
                </div>
