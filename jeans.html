    <header class="main-header">
        <div class="header-container">
            <div class="logo"><a href="index.html">Rakesh<span>Designs</span></a></div>
            <nav class="navbar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="tshirts.html">T-Shirts</a></li>
                    <li><a href="jackets.html">Jackets</a></li>

    <main class="container section-padding">
        <h1 class="section-title">Denim & Jeans Collection</h1>
        <div class="product-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=600" alt="Slim Fit Jeans">

                    <h3>Slim Fit Denim Jeans</h3>

            <div class="product-card">
