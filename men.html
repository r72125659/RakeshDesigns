<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Men's Collection - Rakesh Designs</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .category-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .category-card {
            display: flex;
            align-items: center;
            background-color: #ede4d8;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .category-card img {
            width: 250px;
            height: 160px;
            object-fit: cover;
        }
        .category-info {
            padding: 20px;
            flex-grow: 1;
        }
        .category-info h3 {
            margin: 0 0 5px 0;
            color: #2b2623;
            font-size: 1.4rem;
        }
        .category-info p {
            margin: 0 0 10px 0;
            color: #6e655f;
            font-size: 0.9rem;
        }
        .shop-now-btn {
            display: inline-block;
            color: #2b2623;
            font-weight: bold;
            text-decoration: none;
            border-bottom: 2px solid #2b2623;
            padding-bottom: 2px;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Sales & Offers</a></li>

            <div class="category-card">
                <img src="https://images.unsplash.com/photo-1617137984095-74e4e5e3613f?w=600&auto=format&fit=crop" alt="Men Clothing">
                <div class="category-info">
                    <p>MEN'S FASHION</p>
                    <h3>CLOTHING</h3>
                    <a href="menclothing.html" class="shop-now-btn">SHOP NOW →</a>
