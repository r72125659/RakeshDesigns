<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Men's Accessories - Rakesh Designs</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }
        .product-card {
            border: 1px solid #e2d9cd;
            padding: 15px;
            border-radius: 8px;
            background-color: #ffffff;
            text-align: center;
        }
        .product-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 5px;
        }
        .product-title {
            font-size: 1.1rem;
            margin: 10px 0 5px 0;
            font-weight: bold;
        }
        .price {
            font-weight: bold;
            color: #2b2623;
            margin: 5px 0;
        }
        .btn-add {
            background-color: #2b2623;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Sales & Offers</a></li>
                <li><a href="men.html">Men</a></li>
                <li><a href="womenclothing.html">Women</a></li>
                <li><a href="accessories.html">Accessories</a></li>
                <li><a href="contactus.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main style="padding: 20px;">
        <h1>Men's Accessories</h1>
        <p>Premium leather belts, watches, wallets, and sunglasses for men.</p>

        <div class="product-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=600&auto=format&fit=crop" alt="Men Watch">
                <div class="product-title">Minimalist Quartz Watch</div>
                <div>⭐⭐⭐⭐⭐</div>
                <div class="price">$149.90</div>
                <button class="btn-add">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1624222247344-550fb60583dc?w=600&auto=format&fit=crop" alt="Leather Belt">
                <div class="product-title">Genuine Leather Belt</div>
                <div>⭐⭐⭐⭐⭐</div>
                <div class="price">$39.90</div>
                <button class="btn-add">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1627123424574-724758594e93?w=600&auto=format&fit=crop" alt="Leather Wallet">
                <div class="product-title">Bifold Leather Wallet</div>
                <div>⭐⭐⭐⭐⭐</div>
                <div class="price">$34.90</div>
                <button class="btn-add">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=600&auto=format&fit=crop" alt="Sunglasses">
                <div class="product-title">Polarized Sunglasses</div>
                <div>⭐⭐⭐⭐⭐</div>
                <div class="price">$45.00</div>
                <button class="btn-add">Add to Cart</button>
            </div>
        </div>
    </main>

</body>
</html>
