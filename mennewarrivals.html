<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Men's New Arrivals - Rakesh Designs</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }
        .product-card {
            border: 1px solid #e2d9cd;
            padding: 15px;
            border-radius: 8px;
            background-color: #ffffff;
            text-align: center;
        }
        .product-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 5px;
        }
        .product-title {
            font-size: 1.1rem;
            margin: 10px 0 5px 0;
            font-weight: bold;
        }
        .price {
            font-weight: bold;
            color: #2b2623;
            margin: 5px 0;
        }
        .btn-add {
            background-color: #2b2623;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Sales & Offers</a></li>
                <li><a href="men.html">Men</a></li>
                <li><a href="womenclothing.html">Women</a></li>
                <li><a href="accessories.html">Accessories</a></li>
                <li><a href="contactus.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main style="padding: 20px;">
        <h1>Men's New Arrivals</h1>
        <p>Fresh additions to our men's collection for this season.</p>

        <div class="product-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=600&auto=format&fit=crop" alt="Modern Blazer">
                <div class="product-title">Tailored Slim Fit Blazer</div>
                <div>⭐⭐⭐⭐⭐</div>
                <div class="price">$139.90</div>
                <button class="btn-add">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=600&auto=format&fit=crop" alt="Casual Hoodie">
                <div class="product-title">Urban Fleece Hoodie</div>
                <div>⭐⭐⭐⭐⭐</div>
                <div class="price">$64.90</div>
                <button class="btn-add">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1506630448388-4e683c67ddb0?w=600&auto=format&fit=crop" alt="Casual Shirt">
                <div class="product-title">Patterned Casual Shirt</div>
                <div>⭐⭐⭐⭐⭐</div>
                <div class="price">$54.90</div>
                <button class="btn-add">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600&auto=format&fit=crop" alt="Travel Backpack">
                <div class="product-title">Leather Accent Backpack</div>
                <div>⭐⭐⭐⭐⭐</div>
                <div class="price">$89.90</div>
                <button class="btn-add">Add to Cart</button>
            </div>
        </div>
    </main>

</body>
</html>
