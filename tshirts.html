<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Shirts Collection - Rakesh Designs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <div class="logo"><a href="index.html">Rakesh<span>Designs</span></a></div>
            <nav class="navbar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="tshirts.html" class="active">T-Shirts</a></li>
                    <li><a href="jackets.html">Jackets</a></li>
                    <li><a href="jeans.html">Jeans</a></li>
                    <li><a href="contactus.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container section-padding">
        <h1 class="section-title">Stylish T-Shirts Collection</h1>
        <div class="product-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=600" alt="Casual White Tee">
                <div class="product-info">
                    <h3>Classic White T-Shirt</h3>
                    <div class="price">$24.90</div>
                    <button class="btn-add">Add to Cart</button>
                </div>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=600" alt="Graphic Black Tee">
                <div class="product-info">
                    <h3>Urban Black Graphic Tee</h3>
                    <div class="price">$29.90</div>
                    <button class="btn-add">Add to Cart</button>
                </div>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?w=600" alt="Printed Tee">
                <div class="product-info">
                    <h3>Vintage Printed T-Shirt</h3>
                    <div class="price">$27.90</div>
                    <button class="btn-add">Add to Cart</button>
                </div>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1618354691373-d851c5c3a990?w=600" alt="Plain Polo Tee">
                <div class="product-info">
                    <h3>Premium Cotton Polo</h3>
                    <div class="price">$34.90</div>
                    <button class="btn-add">Add to Cart</button>
                </div>
            </div>
        </div>

    </footer>

</html>
